services:
  postgres:
    image: postgres:16-alpine
    container_name: lead_prospector_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prospector
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: